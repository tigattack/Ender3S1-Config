# Mainsail config
[include mainsail.cfg]
[include timelapse.cfg]
[include adxlmcu.cfg]
[include KAMP_Settings.cfg]

# Host and MCU temperatures
[temperature_sensor pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# Used for SCREWS_TILT_CALCULATE
[screws_tilt_adjust]
screw1: 226, 226
screw1_name: rear right screw
screw2: 52, 66
screw2_name: front left screw
screw3: 226, 66
screw3_name: front right screw
screw4: 52, 226
screw4_name: rear left screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M3 # Use CW for Clockwise and CCW for Counter Clockwise

# Enables support to exclude or cancel individual objects during the printing process.
[exclude_object]

# Support for gcode arc (G2/G3) commands.
[gcode_arcs]
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.
#resolution: 1.0

[firmware_retraction]
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_length: 0.6
#   The speed of retraction, in mm/s. The default is 20 mm/s.
retract_speed: 45
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_extra_length: 0
#   The speed of unretraction, in mm/s. The default is 10 mm/s.
unretract_speed: 45

# Klipper default Ender-3 S1 config:

# This file contains pin mappings for the stock 2021 Creality Ender 3
# S1 & S1 Pro. To use this config, check the STM32 Chip on the
# Mainboard, during "make menuconfig" select accordingly either the
# STM32F103 with "28KiB bootloader" or the STM32F401 with
# "64KiB bootloader" and serial (on USART1 PA10/PA9) for both.

# For a direct serial connection, in "make menuconfig" select
# "Enable extra low-level configuration options" and  Serial
# (on USART2 PA3/PA2), which is on the 10 pin IDC cable used
# for the LCD module as follows: 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The filename
# must be changed to "firmware.bin"

# With STM32F401, you might need to put "firmware.bin" in a
# folder on the SD card called "STM32F4_UPDATE" in order to flash.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 235
position_min: -15
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -8
position_max: 226
position_min: -10
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -10

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
# https://www.klipper3d.org/Rotation_Distance.html#calibrating-rotation_distance-on-extruders
rotation_distance: 26.639
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 23.561
#pid_Ki: 1.208
#pid_Kd: 114.859
min_temp: 0
max_temp: 260 # Set to 300 for S1 Pro
pressure_advance: 0.125
max_extrude_only_distance: 100

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 71.867
pid_Ki: 1.536
pid_Kd: 840.843
min_temp: 0
max_temp: 100 # Set to 110 for S1 Pro

[heater_fan hotend_fan]
pin: PC0

[fan]
pin: PA0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5200
max_z_velocity: 5
max_z_accel: 100

[input_shaper]
# Results from:
# - TEST_RESONANCES AXIS=X
# - TEST_RESONANCES AXIS=Y
# - ~/klipper/scripts/calibrate_shaper.py /tmp/resonances_x_*.csv -o /tmp/shaper_calibrate_x.png
# - ~/klipper/scripts/calibrate_shaper.py /tmp/resonances_y_*.csv -o /tmp/shaper_calibrate_y.png
# it is suggested to set max_accel in [printer] section that does not exceed the estimated values for X and Y axes, likely with some conservative safety margin.
# X: '2hump_ei' frequency = 69.8 Hz (vibrations = 0.0%, smoothing ~= 0.116) suggested max_accel <= 5200 mm/sec^2
# Y: 'mzv' frequency = 42.8 Hz (vibrations = 0.0%, smoothing ~= 0.111) suggested max_accel <= 5400 mm/sec^2
shaper_freq_x: 69.8
shaper_type_x: 2hump_ei
shaper_freq_y: 42.8
shaper_type_y: mzv

[probe]
pin: ^PA15
x_offset: -39.58
y_offset: -39.80
z_offset: 1.809
speed: 5
samples: 3
samples_result: median
samples_tolerance: 0.0075
samples_tolerance_retries: 10
lift_speed: 8

[bed_mesh]
speed: 160
mesh_min: 20, 20
mesh_max: 195, 185
probe_count: 6,6
algorithm: bicubic
adaptive_margin: 5

[safe_z_home]
home_xy_position: 147, 154
speed: 75
z_hop: 10
z_hop_speed: 5
move_to_previous: false

[filament_switch_sensor filament_presence]
switch_pin: !PC15
pause_on_runout: true
runout_gcode: PAUSE

[pause_resume]
recover_velocity: 25

[bed_screws]
screw1: 20, 29
screw2: 195, 29
screw3: 195, 198
screw4: 20, 198


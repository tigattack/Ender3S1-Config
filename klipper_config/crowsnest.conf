#### crowsnest.conf
#### This is a typical default config.
#### Also used as default in mainsail / MainsailOS
#### See:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md
#### for details to configure to your needs.


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. To use any other port would involve      #####
####    changing the proxy configuration or using directly      #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################


[crowsnest]
# Default logfile in ~/klipper_logs/crowsnest.log
log_path: ~/klipper_logs/crowsnest.log
# Valid Options are quiet/verbose/debug
# log_level: debug
log_level: verbose
# Creates a backup and clears the log on every restart, if set to true
rollover_on_start: true

[cam 1]
mode: camera-streamer
port: 8080
# See log for available devices
device: /base/soc/i2c0mux/i2c@1/imx708@1a
resolution: 1920x1080
# If hardware supports it, it will be forced, otherwise ignored/coerced.
max_fps: 30
# You can run the stream services with custom flags.
# Docs for options: https://docs.libcamera.org/master/public-api/namespacelibcamera_1_1controls.html
custom_flags: -camera-options=AfMode=2
# Add v4l2-ctl parameters to set up your camera, see log for your camera capabilities.
# v4l2ctl:
